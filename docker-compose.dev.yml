# Turbo Ledger — local development stack (Phase 0 scope).
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Gateway:    http://localhost:7499        (public entrypoint)
# Identity:   http://localhost:7500        (direct, for debugging only)
# Accounting: http://localhost:7501        (direct, for debugging only)
#
# After first boot, apply migrations:
#   python3 src/tools/migrate.py --service Identity  --tenant default \
#       --database-url postgresql://postgres:postgres@localhost:5432/TlIdentity
#   python3 src/tools/migrate.py --service Accounting --tenant default \
#       --database-url postgresql://postgres:postgres@localhost:5432/TlAccounting

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: Identity }
    environment:
      TL_DB_HOST: postgres
      TL_REDIS_HOST: redis
    ports:
      - "7500:7500"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  accounting:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: Accounting }
    environment:
      TL_DB_HOST: postgres
      TL_REDIS_HOST: redis
    ports:
      - "7501:7501"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: ApiGateway }
    ports:
      - "7499:7499"
    depends_on:
      - identity
      - accounting

volumes:
  pgdata:
