    environment:
      TL_DB_HOST: postgres
      TL_REDIS_HOST: redis
    ports:
      - "7502:7502"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  group:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: Group }
    environment:
      TL_DB_HOST: postgres
