      dockerfile: docker/Dockerfile.service
      args: { SERVICE: SystemConfig }
    environment:
      TL_DB_HOST: postgres
      TL_REDIS_HOST: redis
    ports:
      - "7509:7509"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  provisioner:
