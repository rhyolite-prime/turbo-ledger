  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE: ApiGateway }
    ports:
      - "7499:7499"
    depends_on:
      - identity
      - accounting
      - organization
      - systemconfig
      - provisioner
      - customer
      - depositaccountmanagement
      - portfolio
      - group
      - teller
      - heartbeat
      - template
      - notification

volumes:
  pgdata:
